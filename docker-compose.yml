version: '3.8'

services:
  # 1. Servidor de Base de Datos (MySQL)
  db:
    image: mysql:8.0
    container_name: mysql_practicas
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mi_base_de_datos
      MYSQL_USER: usuario_practicas
      MYSQL_PASSWORD: password_practicas
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./scripts:/docker-entrypoint-initdb.d # Ejecuta automáticamente scripts .sql al iniciar

  # 2. Servidor Web con PHP + Apache
  web:
    image: php:8.2-apache
    container_name: php_practicas
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html # Vincula la carpeta local src/ con la carpeta raíz de Apache
    depends_on:
      - db

  # 3. Interfaz Gráfica para SQL (phpMyAdmin)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_practicas
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - db

volumes:
  db_data:
